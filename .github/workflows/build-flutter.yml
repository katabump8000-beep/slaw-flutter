name: Build Flutter APK
on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Create Android project
        run: |
          flutter create --org io.github.katabump8000_beep --project-name twa --platforms android build_app
          rm -rf build_app/lib build_app/pubspec.yaml
          mkdir build_app/lib
          cp *.dart build_app/lib/
          cp pubspec.yaml build_app/pubspec.yaml

      - name: Android settings
        run: |
          cd build_app
          sed -i 's/minSdk = flutter.minSdkVersion/minSdk = 23/; s/minSdkVersion flutter.minSdkVersion/minSdkVersion 23/' android/app/build.gradle* || true
          python3 - <<'PY'
          p = 'android/app/src/main/AndroidManifest.xml'
          s = open(p, encoding='utf-8').read()
          perms = ''.join('    <uses-permission android:name="android.permission.%s"/>\n' % n for n in ['INTERNET', 'VIBRATE', 'ACCESS_NETWORK_STATE', 'POST_NOTIFICATIONS', 'RECORD_AUDIO'])
          s = s.replace('<application', perms + '    <application', 1)
          link = ('            <intent-filter>\n'
                  '                <action android:name="android.intent.action.VIEW"/>\n'
                  '                <category android:name="android.intent.category.DEFAULT"/>\n'
                  '                <category android:name="android.intent.category.BROWSABLE"/>\n'
                  '                <data android:scheme="fir" android:host="join"/>\n'
                  '            </intent-filter>\n')
          s = s.replace('</activity>', link + '        </activity>', 1)
          import re
          s = re.sub(r'android:label="[^"]*"', 'android:label="FIR"', s, count=1)
          open(p, 'w', encoding='utf-8').write(s)
          PY

      - name: Analyze (shows errors)
        continue-on-error: true
        run: |
          cd build_app
          flutter pub get
          flutter analyze --no-fatal-infos --no-fatal-warnings > ../analyze.txt 2>&1 || true
          grep -E "^ *error" ../analyze.txt | head -40 | while IFS= read -r l; do echo "::error::$l"; done || true

      - name: Build release APK
        run: |
          cd build_app
          flutter pub get
          flutter build apk --release --no-shrink --build-number=$((1000 + ${{ github.run_number }}))

      - name: Sign APK
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KS_PASS: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_PASS: ${{ secrets.KEY_PASSWORD }}
        run: |
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          echo "$KEYSTORE_BASE64" | base64 -d > signing.keystore
          "$BT/zipalign" -p -f 4 build_app/build/app/outputs/flutter-apk/app-release.apk aligned.apk
          "$BT/apksigner" sign --ks signing.keystore --ks-key-alias my-key-alias \
            --ks-pass env:KS_PASS --key-pass env:KEY_PASS --out SLAW.apk aligned.apk
          rm -f signing.keystore aligned.apk

      - uses: actions/upload-artifact@v4
        with:
          name: SLAW-apk
          path: SLAW.apk

      - name: Publish release (public download link)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: FIR build ${{ github.run_number }}
          make_latest: true
          files: SLAW.apk
