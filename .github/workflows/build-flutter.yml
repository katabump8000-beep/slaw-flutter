name: Build Flutter APK
on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Create Android project
        run: |
          flutter create --org io.github.katabump8000_beep --project-name twa --platforms android build_app
          rm -rf build_app/lib build_app/pubspec.yaml
          mkdir -p build_app/lib build_app/assets/audio
          cp *.dart build_app/lib/
          cp pubspec.yaml build_app/pubspec.yaml
          cp *.mp3 *.wav build_app/assets/audio/ 2>/dev/null || true
          ls build_app/assets/audio

      - name: Android settings
        run: |
          cd build_app
          python3 - <<'PY'
          import re, glob
          for p in glob.glob('android/app/build.gradle*'):
              s = open(p, encoding='utf-8').read()
              s = s.replace('minSdk = flutter.minSdkVersion', 'minSdk = 23').replace('minSdkVersion flutter.minSdkVersion', 'minSdkVersion 23')
              if p.endswith('.kts'):
                  s = s.replace('compileOptions {', 'compileOptions {\n        isCoreLibraryDesugaringEnabled = true', 1)
                  s += '\ndependencies {\n    coreLibraryDesugaring("com.android.tools:desugar_jdk_libs:2.1.4")\n}\n'
              else:
                  s = s.replace('compileOptions {', 'compileOptions {\n        coreLibraryDesugaringEnabled true', 1)
                  s += "\ndependencies {\n    coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.1.4'\n}\n"
              open(p, 'w', encoding='utf-8').write(s)
          p = 'android/app/src/main/AndroidManifest.xml'
          s = open(p, encoding='utf-8').read()
          names = ['INTERNET', 'VIBRATE', 'ACCESS_NETWORK_STATE', 'POST_NOTIFICATIONS', 'RECORD_AUDIO', 'WAKE_LOCK', 'RECEIVE_BOOT_COMPLETED']
          perms = ''.join('    <uses-permission android:name="android.permission.%s"/>\n' % n for n in names)
          s = s.replace('<application', perms + '    <application', 1)
          link = ('            <intent-filter>\n'
                  '                <action android:name="android.intent.action.VIEW"/>\n'
                  '                <category android:name="android.intent.category.DEFAULT"/>\n'
                  '                <category android:name="android.intent.category.BROWSABLE"/>\n'
                  '                <data android:scheme="fir" android:host="join"/>\n'
                  '            </intent-filter>\n')
          s = s.replace('</activity>', link + '        </activity>', 1)
          s = re.sub(r'android:label="[^"]*"', 'android:label="FIR"', s, count=1)
          open(p, 'w', encoding='utf-8').write(s)
          for p in glob.glob('android/app/src/main/kotlin/**/MainActivity.kt', recursive=True):
              pkg = re.search(r'^package\s+([\w.]+)', open(p, encoding='utf-8').read(), re.M).group(1)
              kt = """package %s

          import android.content.pm.PackageManager
          import android.os.Build
          import io.flutter.embedding.android.FlutterActivity
          import io.flutter.embedding.engine.FlutterEngine
          import io.flutter.plugin.common.MethodChannel
          import java.security.MessageDigest

          class MainActivity : FlutterActivity() {
              override fun configureFlutterEngine(flutterEngine: FlutterEngine) {
                  super.configureFlutterEngine(flutterEngine)
                  MethodChannel(flutterEngine.dartExecutor.binaryMessenger, "fir/sig").setMethodCallHandler { call, result ->
                      if (call.method == "sig") {
                          try {
                              val bytes = if (Build.VERSION.SDK_INT >= 28) {
                                  val info = packageManager.getPackageInfo(packageName, PackageManager.GET_SIGNING_CERTIFICATES)
                                  info.signingInfo.apkContentsSigners[0].toByteArray()
                              } else {
                                  @Suppress("DEPRECATION")
                                  val info = packageManager.getPackageInfo(packageName, PackageManager.GET_SIGNATURES)
                                  @Suppress("DEPRECATION")
                                  info.signatures[0].toByteArray()
                              }
                              val d = MessageDigest.getInstance("SHA-256").digest(bytes)
                              result.success(d.joinToString("") { "%%02x".format(it) })
                          } catch (e: Exception) {
                              result.success("")
                          }
                      } else {
                          result.notImplemented()
                      }
                  }
              }
          }
          """ % pkg
              kt = '\n'.join(l[10:] if l.startswith(' ' * 10) else l for l in kt.split('\n'))
              open(p, 'w', encoding='utf-8').write(kt)
          PY

      - name: Analyze (shows errors)
        continue-on-error: true
        run: |
          cd build_app
          flutter pub get
          flutter analyze --no-fatal-infos --no-fatal-warnings > ../analyze.txt 2>&1 || true
          grep -E "^ *error" ../analyze.txt | head -40 | while IFS= read -r l; do echo "::error::$l"; done || true

      - name: Build release APK
        run: |
          cd build_app
          flutter pub get
          flutter build apk --release --no-shrink --build-number=$((1000 + ${{ github.run_number }}))

      - name: Sign APK
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KS_PASS: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_PASS: ${{ secrets.KEY_PASSWORD }}
        run: |
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          echo "$KEYSTORE_BASE64" | base64 -d > signing.keystore
          keytool -list -v -keystore signing.keystore -alias my-key-alias -storepass "$KS_PASS" 2>/dev/null | grep -E "SHA1|SHA256" | while IFS= read -r l; do echo "::notice::$l"; done || true
          "$BT/zipalign" -p -f 4 build_app/build/app/outputs/flutter-apk/app-release.apk aligned.apk
          "$BT/apksigner" sign --ks signing.keystore --ks-key-alias my-key-alias \
            --ks-pass env:KS_PASS --key-pass env:KEY_PASS --out SLAW.apk aligned.apk
          rm -f signing.keystore aligned.apk

      - uses: actions/upload-artifact@v4
        with:
          name: SLAW-apk
          path: SLAW.apk

      - name: Publish release (public download link)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: FIR build ${{ github.run_number }}
          make_latest: true
          files: SLAW.apk
