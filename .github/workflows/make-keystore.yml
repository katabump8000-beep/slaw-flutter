name: Make Keystore
on:
  workflow_dispatch:

jobs:
  make:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Generate keystore
        run: |
          PASS=$(openssl rand -hex 12)
          keytool -genkeypair -keystore slaw.jks -storetype PKCS12 \
            -alias my-key-alias -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass "$PASS" -keypass "$PASS" -dname "CN=SLAW"
          base64 -w 0 slaw.jks > keystore_base64.txt
          echo "$PASS" > password.txt
      - uses: actions/upload-artifact@v4
        with:
          name: slaw-keys
          path: |
            slaw.jks
            keystore_base64.txt
            password.txt
